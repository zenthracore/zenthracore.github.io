<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found — ZenthraCore</title>
<meta name="robots" content="noindex, follow">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Unbounded:wght@400;700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c0f;--bg2:#0f1218;--surface:#1a2030;--border:#2a3548;--text:#c8d4e8;--text-dim:#7a90b0;--accent:#00d4ff;--danger:#ff4444;--heading:#e8f0ff;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;}
h1{font-family:'Unbounded',sans-serif;font-size:clamp(60px,10vw,120px);color:var(--danger);line-height:1;margin-bottom:10px;}
p{font-size:18px;color:var(--text-dim);margin-bottom:30px;max-width:500px;}
a{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--accent);text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:14px;transition:all .2s;}
a:hover{background:var(--border);border-color:var(--accent);}
</style>
</head>
<body>
  <h1>404</h1>
  <p>The security path you requested does not exist or has been relocated within the enclave.</p>
  <a href="/">&larr; Return to ZenthraCore Index</a>
</body>
</html>
